services:
  mailhub-mcp:
    # Published image. MAILHUB_VERSION in .env pins a release (e.g. 0.1.0);
    # the default follows the latest 0.1.x. To build from this checkout
    # instead, add -f docker-compose.build.yml (see that file).
    image: ghcr.io/trainedloop/mailhub-mcp:${MAILHUB_VERSION:-0.1}
    # CONTAINER_NAME, HOST_PORT and PORT come from .env (Compose reads it for
    # these substitutions). Defaults suit a single instance; a second instance
    # (another person) sets its own CONTAINER_NAME and HOST_PORT.
    container_name: ${CONTAINER_NAME:-mailhub-mcp}
    restart: unless-stopped
    env_file: .env
    # Loopback only: a plain "8742:8742" would expose the unencrypted server to
    # every network the host is on. Put a TLS-terminating proxy or tunnel in
    # front of 127.0.0.1:<HOST_PORT>. PORT is the port inside the container.
    ports:
      - "127.0.0.1:${HOST_PORT:-8742}:${PORT:-8742}"
    volumes:
      # OAuth state (client registrations, encrypted tokens) and the change
      # journal. Must survive restarts or the claude.ai connector has to
      # reconnect.
      - ./data:/data
      - ./secrets/accounts:/secrets/accounts:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    oom_score_adj: 200
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
